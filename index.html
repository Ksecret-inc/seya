<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --chip: #eef0f4; --chip-on: #1d2330; --chip-on-text: #ffffff; --accent: #2f6fde;
    --up: #13804b; --down: #c2410c;
    --c1: #2f6fde; --c2: #e0742b; --c3: #1a9e77; --c4: #c2416b; --c5: #7a5cd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b1f27; --text: #e8eaef; --muted: #9aa2b1; --line: #2c323d;
      --chip: #262b35; --chip-on: #e8eaef; --chip-on-text: #12151b; --accent: #6a9cf0;
      --up: #4cc38a; --down: #f0915a;
      --c1: #6a9cf0; --c2: #f0915a; --c3: #4cc3a0; --c4: #e9779b; --c5: #a68cf0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .filters { display: grid; gap: 10px; margin-bottom: 16px; }
  .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .frow > .frow { flex: 1 1 0; min-width: 0; }
  .flabel { width: 44px; font-size: 13px; font-weight: 700; color: var(--muted); flex: none; }
  .chip { border: 0; background: var(--chip); color: var(--text); padding: 6px 11px; border-radius: 999px;
          font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { outline: 1px solid var(--line); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--panel); color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .reset { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .active-note { font-size: 12px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi .k { font-size: 13px; color: var(--muted); }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid > *, .grid2 > * { min-width: 0; }
  .phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .phead h2 { font-size: 15px; margin: 0; }
  .hint { font-size: 12px; color: var(--muted); }
  .chartbox { position: relative; height: 300px; }
  .chartbox.short { height: 260px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; }
  tbody td.cell { cursor: pointer; }
  tbody td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid, .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>매출 대시보드 2026</h1>
      <div class="sub">출처: [교육용 더미] 매출 데이터 2026 (Google Sheets) · 2026-01 ~ 2026-10 · 제품 5종 · 채널 4곳</div>
    </div>
    <div class="seg" id="metricSeg">
      <button data-v="rev" class="on">매출(원)</button>
      <button data-v="qty">판매수량</button>
    </div>
  </header>

  <section class="panel filters">
    <div class="frow"><span class="flabel">월</span><div class="frow" id="fMonth"></div></div>
    <div class="frow"><span class="flabel">제품</span><div class="frow" id="fProduct"></div></div>
    <div class="frow"><span class="flabel">채널</span><div class="frow" id="fChannel"></div>
      <button class="reset" id="reset">필터 초기화</button></div>
    <div class="active-note" id="activeNote"></div>
  </section>

  <section class="kpis">
    <div class="panel kpi"><div class="k">총 매출</div><div class="v" id="kRev"></div><div class="d" id="kRevD"></div></div>
    <div class="panel kpi"><div class="k">판매수량</div><div class="v" id="kQty"></div><div class="d" id="kQtyD"></div></div>
    <div class="panel kpi"><div class="k">평균 할인율</div><div class="v" id="kDisc"></div><div class="d">정가 대비 실제 매출 기준</div></div>
    <div class="panel kpi"><div class="k">매출 1위</div><div class="v" id="kTop" style="font-size:18px"></div><div class="d" id="kTopD"></div></div>
  </section>

  <section class="grid">
    <div class="panel">
      <div class="phead">
        <h2>월별 추이</h2>
        <div class="seg" id="stackSeg">
          <button data-v="none" class="on">합계</button>
          <button data-v="product">제품별</button>
          <button data-v="channel">채널별</button>
        </div>
      </div>
      <div class="chartbox"><canvas id="cMonth"></canvas></div>
      <div class="hint">막대를 클릭하면 해당 월로 필터됩니다.</div>
    </div>
    <div class="panel">
      <div class="phead"><h2>채널별</h2></div>
      <div class="chartbox"><canvas id="cChannel"></canvas></div>
      <div class="hint">조각을 클릭하면 해당 채널로 필터됩니다.</div>
    </div>
  </section>

  <section class="grid2">
    <div class="panel">
      <div class="phead"><h2>제품별</h2></div>
      <div class="chartbox short"><canvas id="cProduct"></canvas></div>
      <div class="hint">막대를 클릭하면 해당 제품으로 필터됩니다.</div>
    </div>
    <div class="panel">
      <div class="phead"><h2>제품 × 채널</h2><span class="hint">셀을 클릭하면 제품·채널을 함께 필터</span></div>
      <div class="tablewrap"><table id="pivot"></table></div>
    </div>
  </section>
</div>

<script>
// ---- 데이터 (Google Sheets에서 가져온 원본 200행) ----
// 매출(원) = 판매수량 × 정가 × (1 − 할인율/100) — 시트의 매출 열과 같은 값
const PRODUCTS = ["데일리 선크림", "진정 시카 앰플", "수분 장벽 크림", "에센셜 마스크팩(10매)", "약산성 클렌징폼"];
const PRICES   = [19000, 24000, 28000, 15000, 12000];
const CHANNELS = ["올리브영", "자사몰", "쿠팡", "아마존(해외)"];
const MONTHS   = ["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10"];
// 월마다 제품(위 순서) × 채널(위 순서) 20칸, "판매수량/할인율"
const RAW = [
 "439/20 209/10 330/20 237/0 600/0 300/10 487/0 404/5 587/0 323/0 502/0 351/15 795/5 324/5 521/20 422/5 746/0 369/10 497/10 371/0",
 "566/10 242/10 365/0 305/0 595/0 318/0 456/15 388/0 650/0 267/10 426/20 439/10 921/20 394/5 627/10 537/0 715/20 371/0 528/10 481/0",
 "741/0 405/10 496/15 578/10 664/20 292/5 373/0 342/5 506/5 246/0 314/20 303/15 844/15 391/0 546/0 595/20 733/5 308/10 425/20 389/0",
 "968/20 554/0 710/5 835/20 680/10 261/5 503/5 396/5 406/0 204/10 260/0 235/0 737/10 415/0 591/0 489/15 691/20 347/0 513/20 466/15",
 "1416/15 590/10 958/5 1103/5 662/20 308/5 422/20 434/10 328/10 121/5 221/0 247/5 751/20 396/0 594/20 552/0 747/10 348/10 480/10 587/10",
 "1812/20 647/5 1025/5 1108/5 520/20 281/5 386/20 473/15 307/5 117/10 170/10 189/5 905/5 329/10 642/0 595/15 718/0 279/10 520/15 584/10",
 "1657/15 874/10 1148/10 1216/15 623/0 323/0 395/20 546/10 310/15 139/5 200/0 191/0 878/10 391/5 634/0 623/20 668/15 353/0 501/15 627/15",
 "1506/15 771/10 1230/10 1333/0 670/15 296/5 505/15 486/20 309/0 135/10 210/0 222/10 964/15 455/5 651/10 734/0 829/0 314/0 505/20 608/0",
 "1133/0 424/0 672/10 791/0 637/15 235/0 466/20 451/0 425/10 200/5 345/0 369/0 888/10 307/5 638/0 768/0 739/10 354/10 537/10 616/0",
 "773/5 317/5 541/0 668/10 573/0 321/5 376/0 536/0 655/0 277/10 432/10 436/15 776/10 376/5 528/20 675/0 772/20 340/10 530/10 558/15"
];
const ROWS = [];
RAW.forEach((line, m) => line.split(" ").forEach((cell, i) => {
  const [qty, disc] = cell.split("/").map(Number);
  const p = Math.floor(i / 4), c = i % 4;
  ROWS.push({ m, p, c, qty, disc, list: qty * PRICES[p], rev: Math.round(qty * PRICES[p] * (1 - disc / 100)) });
}));

// ---- 상태 ----
const state = { months: new Set(), products: new Set(), channels: new Set(), metric: "rev", stack: "none" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const palette = () => [css("--c1"), css("--c2"), css("--c3"), css("--c4"), css("--c5")];
const fmtWon = v => v >= 1e8 ? (v / 1e8).toFixed(2) + "억원" : Math.round(v / 1e4).toLocaleString("ko-KR") + "만원";
const fmtNum = v => Math.round(v).toLocaleString("ko-KR");
const fmtMetric = v => state.metric === "rev" ? fmtWon(v) : fmtNum(v) + "개";
const monthLabel = m => Number(MONTHS[m].slice(5)) + "월";

// 한 차원(skip)을 제외한 나머지 필터를 통과하는 행 → 차트는 자기 차원은 전부 보여주고 선택한 항목만 강조
function rowsFor(skip) {
  return ROWS.filter(r =>
    (skip === "m" || !state.months.size   || state.months.has(r.m)) &&
    (skip === "p" || !state.products.size || state.products.has(r.p)) &&
    (skip === "c" || !state.channels.size || state.channels.has(r.c)));
}
const sum = (rows, k) => rows.reduce((a, r) => a + r[k], 0);
const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); render(); };

// ---- 필터 칩 ----
function buildChips(el, labels, set, colors) {
  el.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (set.size ? "" : " on");
  all.textContent = "전체";
  all.onclick = () => { set.clear(); render(); };
  el.appendChild(all);
  labels.forEach((lab, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (set.has(i) ? " on" : "");
    b.innerHTML = (colors ? `<span class="dot" style="background:${colors[i]}"></span>` : "") + lab;
    b.onclick = () => toggle(set, i);
    el.appendChild(b);
  });
}

// ---- 차트 ----
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
let cMonth, cProduct, cChannel;
function axisColors() {
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--line");
}
const dim = (color, on) => on ? color : color + "40";
const tooltipLabel = ctx => `${ctx.dataset.label ? ctx.dataset.label + ": " : ""}${fmtMetric(ctx.raw)}`;
const yTicks = { callback: v => state.metric === "rev" ? (v >= 1e8 ? v / 1e8 + "억" : v / 1e4 + "만") : fmtNum(v) };

function makeCharts() {
  axisColors();
  cMonth = new Chart(document.getElementById("cMonth"), {
    type: "bar",
    data: { labels: MONTHS.map((_, m) => monthLabel(m)), datasets: [] },
    options: {
      maintainAspectRatio: false,
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: yTicks } },
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10 } }, tooltip: { mode: "index", callbacks: { label: tooltipLabel } } },
      onClick: (e, els) => { if (els.length) toggle(state.months, els[0].index); },
      onHover: (e, els) => e.native.target.style.cursor = els.length ? "pointer" : "default"
    }
  });
  cProduct = new Chart(document.getElementById("cProduct"), {
    type: "bar",
    data: { labels: PRODUCTS, datasets: [{ data: [] }] },
    options: {
      indexAxis: "y", maintainAspectRatio: false,
      scales: { x: { ticks: yTicks }, y: { grid: { display: false } } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: tooltipLabel } } },
      onClick: (e, els) => { if (els.length) toggle(state.products, els[0].index); },
      onHover: (e, els) => e.native.target.style.cursor = els.length ? "pointer" : "default"
    }
  });
  cChannel = new Chart(document.getElementById("cChannel"), {
    type: "doughnut",
    data: { labels: CHANNELS, datasets: [{ data: [], borderWidth: 2 }] },
    options: {
      maintainAspectRatio: false, cutout: "58%",
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => {
          const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
          return `${ctx.label}: ${fmtMetric(ctx.raw)} (${(ctx.raw / total * 100).toFixed(1)}%)`;
        } } }
      },
      onClick: (e, els) => { if (els.length) toggle(state.channels, els[0].index); },
      onHover: (e, els) => e.native.target.style.cursor = els.length ? "pointer" : "default"
    }
  });
}

function updateCharts() {
  const k = state.metric, pal = palette();
  // 월별
  const mRows = rowsFor("m");
  const mOn = m => !state.months.size || state.months.has(m);
  let ds;
  if (state.stack === "none") {
    const vals = MONTHS.map((_, m) => sum(mRows.filter(r => r.m === m), k));
    ds = [{ label: "", data: vals, backgroundColor: MONTHS.map((_, m) => dim(pal[0], mOn(m))), borderRadius: 4 }];
  } else {
    const dimKey = state.stack === "product" ? "p" : "c";
    const labels = state.stack === "product" ? PRODUCTS : CHANNELS;
    ds = labels.map((lab, i) => ({
      label: lab,
      data: MONTHS.map((_, m) => sum(mRows.filter(r => r.m === m && r[dimKey] === i), k)),
      backgroundColor: MONTHS.map((_, m) => dim(pal[i], mOn(m)))
    })).filter(d => d.data.some(v => v > 0));
  }
  cMonth.data.datasets = ds;
  cMonth.options.plugins.legend.display = state.stack !== "none";
  cMonth.update();
  // 제품별
  const pRows = rowsFor("p");
  cProduct.data.datasets[0].data = PRODUCTS.map((_, p) => sum(pRows.filter(r => r.p === p), k));
  cProduct.data.datasets[0].backgroundColor = PRODUCTS.map((_, p) => dim(pal[p], !state.products.size || state.products.has(p)));
  cProduct.data.datasets[0].borderRadius = 4;
  cProduct.update();
  // 채널별
  const cRows = rowsFor("c");
  cChannel.data.datasets[0].data = CHANNELS.map((_, c) => sum(cRows.filter(r => r.c === c), k));
  cChannel.data.datasets[0].backgroundColor = CHANNELS.map((_, c) => dim(pal[c], !state.channels.size || state.channels.has(c)));
  cChannel.data.datasets[0].borderColor = css("--panel");
  cChannel.update();
}

// ---- KPI ----
function updateKpis() {
  const rows = rowsFor(null);
  const rev = sum(rows, "rev"), qty = sum(rows, "qty"), list = sum(rows, "list");
  document.getElementById("kRev").textContent = fmtWon(rev);
  document.getElementById("kQty").textContent = fmtNum(qty) + "개";
  document.getElementById("kDisc").textContent = list ? ((1 - rev / list) * 100).toFixed(1) + "%" : "–";
  const all = sum(ROWS, "rev");
  document.getElementById("kRevD").textContent = rev === all ? "전체 기간 · 전체 제품 · 전체 채널" : `전체의 ${(rev / all * 100).toFixed(1)}%`;
  // 선택 범위 마지막 달 vs 그 전달
  const ms = [...new Set(rows.map(r => r.m))].sort((a, b) => a - b);
  const last = ms[ms.length - 1], prev = ms.length > 1 ? ms[ms.length - 2] : null;
  if (prev !== null && last - prev === 1) {
    const a = sum(rows.filter(r => r.m === last), "qty"), b = sum(rows.filter(r => r.m === prev), "qty");
    const ch = (a / b - 1) * 100;
    document.getElementById("kQtyD").innerHTML = `${monthLabel(last)} 전월 대비 <b style="color:var(${ch >= 0 ? "--up" : "--down"})">${ch >= 0 ? "▲" : "▼"} ${Math.abs(ch).toFixed(1)}%</b>`;
  } else {
    document.getElementById("kQtyD").textContent = ms.length ? `${ms.length}개월 합계` : "";
  }
  // 1위 제품
  const byP = PRODUCTS.map((_, p) => sum(rows.filter(r => r.p === p), "rev"));
  const byC = CHANNELS.map((_, c) => sum(rows.filter(r => r.c === c), "rev"));
  const tp = byP.indexOf(Math.max(...byP)), tc = byC.indexOf(Math.max(...byC));
  document.getElementById("kTop").textContent = rev ? PRODUCTS[tp] : "–";
  document.getElementById("kTopD").textContent = rev ? `${fmtWon(byP[tp])} · 채널 1위 ${CHANNELS[tc]}` : "";
}

// ---- 제품 × 채널 표 ----
function updatePivot() {
  // 월 필터만 적용하고 제품·채널은 전부 보여준 뒤, 선택한 칸을 굵게 강조
  const rows = ROWS.filter(r => !state.months.size || state.months.has(r.m)), k = state.metric;
  const cell = (p, c) => sum(rows.filter(r => r.p === p && r.c === c), k);
  const pOn = p => !state.products.size || state.products.has(p);
  const cOn = c => !state.channels.size || state.channels.has(c);
  const sel = (p, c) => (state.products.size || state.channels.size) && pOn(p) && cOn(c);
  const max = Math.max(...PRODUCTS.flatMap((_, p) => CHANNELS.map((_, c) => cell(p, c))));
  const accent = css("--accent");
  let h = "<thead><tr><th>제품</th>" + CHANNELS.map(c => `<th>${c}</th>`).join("") + "<th>합계</th></tr></thead><tbody>";
  PRODUCTS.forEach((pn, p) => {
    let tot = 0;
    h += `<tr><td>${pn}</td>`;
    CHANNELS.forEach((_, c) => {
      const v = cell(p, c); tot += v;
      const a = Math.round((v / max) * 38).toString(16).padStart(2, "0");
      h += `<td class="cell" data-p="${p}" data-c="${c}" style="background:${accent}${a};${sel(p, c) ? "font-weight:700" : ""}">${fmtMetric(v)}</td>`;
    });
    h += `<td><b>${fmtMetric(tot)}</b></td></tr>`;
  });
  const colT = CHANNELS.map((_, c) => PRODUCTS.reduce((a, __, p) => a + cell(p, c), 0));
  h += "</tbody><tfoot><tr><td>합계</td>" + colT.map(v => `<td>${fmtMetric(v)}</td>`).join("") + `<td>${fmtMetric(colT.reduce((a, b) => a + b, 0))}</td></tr></tfoot>`;
  const t = document.getElementById("pivot");
  t.innerHTML = h;
  t.querySelectorAll("td.cell").forEach(td => td.onclick = () => {
    const p = +td.dataset.p, c = +td.dataset.c;
    const already = state.products.size === 1 && state.products.has(p) && state.channels.size === 1 && state.channels.has(c);
    state.products = new Set(already ? [] : [p]);
    state.channels = new Set(already ? [] : [c]);
    render();
  });
}

function updateNote() {
  const parts = [];
  if (state.months.size) parts.push("월: " + [...state.months].sort((a, b) => a - b).map(monthLabel).join(", "));
  if (state.products.size) parts.push("제품: " + [...state.products].map(p => PRODUCTS[p]).join(", "));
  if (state.channels.size) parts.push("채널: " + [...state.channels].map(c => CHANNELS[c]).join(", "));
  document.getElementById("activeNote").textContent = parts.length ? "적용된 필터 — " + parts.join(" · ") : "필터 없음 · 차트나 표를 클릭해서 골라 보세요.";
}

function render() {
  const pal = palette();
  buildChips(document.getElementById("fMonth"), MONTHS.map((_, m) => monthLabel(m)), state.months);
  buildChips(document.getElementById("fProduct"), PRODUCTS, state.products, pal);
  buildChips(document.getElementById("fChannel"), CHANNELS, state.channels, pal);
  updateKpis(); updateCharts(); updatePivot(); updateNote();
}

function bindSeg(id, key) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    state[key] = b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("on", x === b));
    render();
  });
}
bindSeg("metricSeg", "metric");
bindSeg("stackSeg", "stack");
document.getElementById("reset").onclick = () => { state.months.clear(); state.products.clear(); state.channels.clear(); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { axisColors(); render(); });

makeCharts();
render();
</script>
</body>
</html>
